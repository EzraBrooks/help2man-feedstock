schema_version: 1

context:
  name: help2man
  version: "1.49.3"
  sha256: 4d7e4fdef2eca6afe07a2682151cea78781e0a4e8f9622142d9f70c083a2fd4f

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/${{ name }}/${{ name }}-${{ version }}.tar.xz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.xz
  patches:
    - 0001-Fix-shebang-in-face-of-short-limits.patch

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - make
  host:
    - perl
  run:
    - perl

tests:
  - script:
      - help2man --help
      - test -f ${PREFIX}/bin/help2man

about:
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: help2man produces simple manual pages from the --help and --version output of other commands.
  homepage: https://www.gnu.org/software/help2man/
  documentation: https://www.gnu.org/software/help2man/

extra:
  recipe-maintainers:
    - mariusvniekerk
